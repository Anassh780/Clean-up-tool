name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install psutil textual rich

      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s tests -v

      - name: Check the package installs and exposes "sweep"
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install .
          sweep --version

      - name: Build and verify the portable release zip
        if: matrix.python-version == '3.12'
        run: python tools/build_release.py --out dist --verify
